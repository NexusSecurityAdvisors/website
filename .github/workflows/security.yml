name: Security

# SAST (incl. LLM/agent rules), dependency and secret checks, and a workflow audit.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep (SAST + agent rules)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # baseline diff on pull requests
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install "semgrep==1.186.0"
      # Pull requests fail only on NEW high-severity findings; pushes and the weekly run report everything.
      - name: Scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          args=(--config p/default --config .semgrep/ --metrics=off --sarif-output=semgrep.sarif)
          if [ -n "$BASE_SHA" ]; then args+=(--baseline-commit "$BASE_SHA" --severity ERROR --error); fi
          semgrep scan "${args[@]}"
      - name: Upload SARIF to code scanning
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0
          comment-summary-in-pr: never
